<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>天宝Phone · 任务截图</title>
<style>
:root{color-scheme:dark;--bg:#000;--panel:#161b1d;--ink:#f5f0de;--dim:#a8b3b5;--accent:#f1be4c;--line:#465052}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{padding:24px 32px;border-bottom:1px solid var(--line);display:flex;gap:24px;align-items:baseline;flex-wrap:wrap}h1{font-size:24px;margin:0;font-weight:600}header p{margin:0;color:var(--dim)}main{max-width:1320px;margin:auto;padding:24px 32px;display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1fr);gap:40px}h2{font-size:18px;margin:0 0 12px}p{max-width:70ch}.stage{background:var(--panel);min-height:440px;height:72vh;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}#shot{display:none;width:100%;height:100%;object-fit:contain}#empty{padding:24px;max-width:32ch;color:var(--dim)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:8px 16px;min-height:44px;cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}#list{display:grid;gap:12px;max-height:72vh;overflow:auto;padding:4px}#list button{text-align:left;width:100%;padding:16px}small{display:block;color:var(--dim);font-size:14px;overflow-wrap:anywhere}.action{margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}#meta,#notice{color:var(--dim);font-size:14px}#mode{color:var(--accent)}@media(max-width:720px){header{padding:20px}main{padding:20px;grid-template-columns:1fr;gap:24px}.stage{height:65vh;min-height:320px}#list{max-height:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<header><h1>天宝Phone</h1><p>任务截图 · AI 实际看到的那一帧</p></header>
<main><section aria-labelledby="picture-title"><div class="toolbar"><h2 id="picture-title">等待模型看图</h2><button id="follow" aria-pressed="true">跟随最新一步</button></div><div class="stage"><p id="empty">尚未收到模型截图。连接成功后，每次模型看图会出现一张原图；不会用模拟图片代替。</p><img id="shot" alt="当前模型调用使用的 iPhone 屏幕截图"></div><p id="meta"></p><p id="mode">跟随最新一步</p></section><section aria-labelledby="steps-title"><h2 id="steps-title">看图与动作</h2><p id="status" role="status" aria-atomic="true">正在连接本机预览服务…</p><p id="notice">这是逐步决策截图，不是实时视频。画面停留只代表上一次模型看图；不代表手机此刻未变化。</p><div id="list"></div></section></main>
<script>
const $=id=>document.getElementById(id);let selected=null,following=true,revision=-1,snapshot=null;
const clock=t=>new Date(t*1000).toLocaleTimeString('zh-CN',{hour12:false});
function render(state){
  snapshot=state;$('status').textContent=state.status;
  const looks=state.events.filter(e=>e.kind==='look');
  if(following&&looks.length)selected=looks.at(-1).id;
  const frame=looks.find(e=>e.id===selected);
  if(frame){
    const diagnostic=frame.role==='diagnostic';
    $('shot').src='/frame/'+encodeURIComponent(frame.id);
    $('shot').alt=diagnostic?'连通性诊断用的 iPhone 真实截图，未发送给模型':'当前模型调用使用的 iPhone 屏幕截图';
    $('shot').style.display='block';$('empty').style.display='none';
    $('picture-title').textContent=diagnostic?'真实截图 · 连通性诊断（非模型调用）':frame.role==='planner'?'规划时看到的画面':'执行下一步前的画面';
    $('meta').textContent=`看图时间 ${clock(frame.time)} · 采集时画面年龄 ${frame.frameAge>=0?frame.frameAge.toFixed(2)+' 秒':'未知'} · 编号 ${frame.id.slice(0,8)}`;
  }
  $('follow').setAttribute('aria-pressed',String(following));
  $('mode').textContent=following?'跟随最新一步（保留最后一次截图）':'历史回看 · 已暂停跟随';
  $('list').replaceChildren();
  for(const [i,look] of looks.entries()){
    const diagnostic=look.role==='diagnostic';
    const b=document.createElement('button');b.setAttribute('aria-pressed',String(selected===look.id));
    const title=document.createElement('span');
    title.textContent=`${i+1}. ${diagnostic?'连通性诊断':look.role==='planner'?'规划看图':'执行看图'} · ${clock(look.time)}`;
    const small=document.createElement('small');small.textContent=look.task||'当前任务';
    const action=document.createElement('div');action.className='action';
    const decisions=state.events.filter(e=>e.id===look.id&&e.kind==='decision').flatMap(e=>e.actions||[]);
    const executed=state.events.filter(e=>e.id===look.id&&e.kind==='action');
    action.textContent=diagnostic?'仅检查截图传输：未请求模型，未执行点击。':decisions.length?`模型选定动作：\n${decisions.join('\n')}\n已执行 ${executed.length} 项`:'正在理解画面，或尚未收到动作记录';
    b.append(title,small,action);b.onclick=()=>{selected=look.id;following=false;render(snapshot)};$('list').append(b);
  }
}
$('follow').onclick=()=>{following=true;if(snapshot)render(snapshot)};
async function poll(){try{const r=await fetch('/state',{cache:'no-store'});if(!r.ok)throw Error();const state=await r.json();if(state.revision!==revision){revision=state.revision;render(state)}}catch{$('status').textContent='本机预览服务已断开；当前图片仅供回看。'}finally{setTimeout(poll,1000)}}poll();
</script></html>
