name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

# The release upload previously failed with 403 even after successfully building the IPA.
permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run iOS unit tests
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if ".iOS-" in k for v in vs if v["name"].startswith("iPhone")))')
          xcodebuild test \
            -project IPhoneAgent.xcodeproj \
            -scheme IPhoneAgent \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive App (Unsigned)
        run: |
          xcodebuild archive \
            -project IPhoneAgent.xcodeproj \
            -scheme IPhoneAgent \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -archivePath build/IPhoneAgent.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package to IPA
        run: |
          mkdir -p Payload
          cp -r build/IPhoneAgent.xcarchive/Products/Applications/IPhoneAgent.app Payload/
          zip -qr IPhoneAgent.ipa Payload
          ls -lh IPhoneAgent.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPhoneAgent-IPA
          path: ios/IPhoneAgent.ipa

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: latest-build
          name: Latest Build
          body: "Automated build of IPhoneAgent.ipa from GitHub Actions."
          files: ios/IPhoneAgent.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
