name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Archive App (Unsigned)
        run: |
          xcodebuild archive \
            -project IPhoneAgent.xcodeproj \
            -scheme IPhoneAgent \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/IPhoneAgent.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package to IPA
        run: |
          mkdir -p Payload
          cp -r build/IPhoneAgent.xcarchive/Products/Applications/IPhoneAgent.app Payload/
          zip -qr IPhoneAgent.ipa Payload
          ls -lh IPhoneAgent.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPhoneAgent-IPA
          path: ios/IPhoneAgent.ipa

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: latest-build
          name: Latest Build
          body: "Automated build of IPhoneAgent.ipa from GitHub Actions."
          files: ios/IPhoneAgent.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
